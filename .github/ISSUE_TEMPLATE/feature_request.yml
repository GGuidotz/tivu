name: Idea
description: Un comando che manca, un modello di TV che non va, un modo migliore di fare qualcosa. A missing command, a TV model that doesn't work, a better way to do something.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: L'idea / The idea
      description: Cosa vorresti e perché ti servirebbe. What you'd like and why it would help.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App, macOS, Mac
      description: Compilato dall'app. Filled in by the app.
